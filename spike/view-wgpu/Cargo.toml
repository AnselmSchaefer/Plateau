# The garden shown with wgpu and winit by hand (POC_PLAN.md, step 0), to set against spike/view-bevy.
[package]
name = "view-wgpu"
version = "0.0.0"
edition.workspace = true
publish.workspace = true

[dependencies]
wgpu = "30.0.1"
winit = "0.30.13"
glam = "0.32"
pollster = "0.4"
bytemuck = { version = "1", features = ["derive"] }
spike-host = { path = "../host" }
