# Plateau, played (POC_PLAN.md, step 2): one area walked first person at three sizes, in Bevy, its
# surface made off the frame by the engine. The engine knows nothing of Bevy; this crate is the window.
[package]
name = "plateau-play"
version = "0.0.0"
edition.workspace = true
publish.workspace = true

[dependencies]
# Pinned, and not chased (POC_PLAN.md, "Risks"): the spike's version, with text for the HUD.
bevy = { version = "=0.20.1", default-features = false, features = ["3d", "bevy_ui", "bevy_ui_render"] }
plateau-engine = { path = "../engine" }
