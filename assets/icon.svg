<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Plateau</title>
  <!-- Plateau's icon, the winged lion: a lion with a boy's face and eagle's wings standing on a plateau at dusk,
       against the setting sun, and in the cliff below it a crack only the tiny fit through. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#262a63"/>
      <stop offset="0.45" stop-color="#7d4a8c"/>
      <stop offset="0.75" stop-color="#f08a5d"/>
      <stop offset="0.9" stop-color="#ffc27a"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff3c4"/>
      <stop offset="0.55" stop-color="#ffd08a"/>
      <stop offset="0.75" stop-color="#ffb070" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ff9a6a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.75" r="0.6">
      <stop offset="0" stop-color="#fff1b8"/>
      <stop offset="0.5" stop-color="#ffc35a"/>
      <stop offset="1" stop-color="#e0782a"/>
    </radialGradient>
    <linearGradient id="hide" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2e2147"/>
      <stop offset="1" stop-color="#1b1430"/>
    </linearGradient>
    <clipPath id="tile"><rect width="512" height="512" rx="112"/></clipPath>
    <clipPath id="mesa">
      <path d="M22 512 L66 380 Q76 346 106 343 L408 343 Q438 346 448 380 L492 512 Z"/>
    </clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="512" height="512" fill="url(#sky)"/>
    <circle cx="282" cy="236" r="150" fill="url(#sun)"/>
    <!-- Plateaus far off, in the haze. -->
    <path d="M0 410 L0 378 L34 378 L46 361 L134 361 L150 386 L512 386 L512 410 Z" fill="#b8607a" opacity="0.8"/>
    <path d="M330 392 L346 372 L470 372 L482 357 L512 357 L512 410 L330 410 Z" fill="#9c4f72" opacity="0.8"/>
    <!-- The plateau, in its layers, in the evening's shade. -->
    <g clip-path="url(#mesa)">
      <rect y="330" width="512" height="200" fill="#5e2430"/>
      <path d="M0 448 Q128 438 256 450 T512 444 L512 330 L0 330 Z" fill="#7d2f33"/>
      <path d="M0 410 Q140 402 260 413 T512 405 L512 330 L0 330 Z" fill="#a03f38"/>
      <path d="M0 378 Q120 372 250 381 T512 375 L512 330 L0 330 Z" fill="#c45a3f"/>
      <rect y="330" width="512" height="22" fill="#d97a4c"/>
      <rect y="330" width="512" height="13" fill="#f0a364"/>
      <path d="M0 330 L112 330 Q86 346 80 376 L46 512 L0 512 Z" fill="#1d0b14" opacity="0.3"/>
      <path d="M512 330 L402 330 Q428 346 434 376 L468 512 L512 512 Z" fill="#ffd9b0" opacity="0.12"/>
      <!-- A crack in the cliff, a home inside it for the tiny. -->
      <path d="M150 470 L150 446 Q150 431 159 431 Q168 431 168 446 L168 470 Z" fill="#2a0d10"/>
      <path d="M153 470 L153 448 Q153 436 159 436 Q165 436 165 448 L165 470 Z" fill="url(#glow)"/>
    </g>
    <!-- The far wing and far legs, paler with the distance. -->
    <g fill="#4b3062">
      <path d="M232 246 Q226 150 258 62 L264 58 Q254 74 220 76 Q206 82 226 96 Q198 100 190 108 Q186 118 210 128
        Q188 138 184 148 Q184 158 208 164 Q194 178 192 188 Q194 198 216 200 Q206 212 206 224 Z"/>
      <path d="M226 286 L228 336 Q220 338 220 343 L242 343 L240 288 Z"/>
      <path d="M298 282 Q306 302 314 318 L316 336 Q308 338 308 343 L330 343 L330 318 L326 284 Z"/>
    </g>
    <g fill="url(#hide)">
      <!-- The near wing, an eagle's: the long feathers fanned out behind. -->
      <path d="M236 250 Q252 150 318 84 Q336 64 362 60 Q420 62 466 100 L434 116 L456 140 L420 148 L440 172
        L404 176 L418 200 L384 200 L392 226 L360 220 L362 244 L334 236 L318 258 Z"/>
      <!-- Body and legs. -->
      <path d="M206 246 Q192 266 200 284 L202 336 Q192 337 192 343 L218 343 L216 290 Q262 298 310 280
        Q318 300 330 316 L332 336 Q324 337 324 343 L350 343 L350 322 Q366 300 368 272 Q370 250 352 242
        Q300 232 232 238 Z"/>
      <!-- The tail, ending in a tuft. -->
      <path d="M366 258 Q414 270 426 240 Q432 220 422 206" fill="none" stroke="#231a3a" stroke-width="6"
        stroke-linecap="round"/>
      <path d="M422 210 Q411 200 416 188 Q424 180 430 190 Q435 202 422 210 Z"/>
      <!-- The mane. -->
      <path transform="translate(212 244) scale(0.7) translate(-212 -244)" d="M155.7 222.8 Q139.2 229.9 136.1 213.6 Q143.6 208.7 150.4 206.3 Q142.4 204.0 146.7 188.1 Q153.5 188.6 153.9 189.0 Q147.9 181.7 158.5 166.8 Q164.2 172.0 164.0 174.7 Q161.7 163.7 177.8 152.7 Q180.4 161.6 178.7 166.2 Q181.4 153.4 200.8 148.2 Q199.4 159.3 195.6 164.9 Q203.4 152.7 223.6 154.3 Q217.5 165.4 211.4 171.0 Q223.7 161.7 241.9 169.8 Q231.6 179.0 223.3 183.6 Q238.6 178.7 252.4 191.8 Q239.0 197.4 229.2 200.2 Q245.4 200.7 253.1 216.4 Q238.4 217.4 227.9 217.8 Q250.1 226.3 250.8 244.1 Q235.1 239.8 219.8 233.3 Q237.0 249.0 231.0 263.3 Q218.1 254.2 206.2 243.9 Q216.0 263.9 205.4 272.1 Q196.9 260.0 189.7 247.5 Q191.1 268.2 178.6 268.9 Q175.3 255.9 173.3 243.6 Z"/>
      <!-- The face, a boy's, in profile: brow, a small straight nose, lips, a chin, a clean jaw. -->
      <path transform="translate(212 244) scale(0.7) translate(-212 -244)" d="M178 160 Q154 154 142 168 Q136 176 137 186 Q138 190 136 193 L129 203 Q127 206 130 207 Q133 208 134 209
        Q132 212 133 214 Q135 215 134 216 Q132 218 134 220 Q137 222 137 224 Q135 229 140 231 Q152 234 166 229
        Q182 222 186 204 Q187 176 178 160 Z"/>
      <!-- His hair, swept back from a fringe over the forehead into the mane. -->
      <path transform="translate(212 244) scale(0.7) translate(-212 -244)" d="M136 179 Q135 164 148 155 Q160 145 177 145 Q192 145 202 153 Q216 154 226 166 Q212 162 204 166
        Q214 172 216 184 Q204 172 192 170 Q182 164 170 165 Q160 168 153 176 Q151 170 148 168 Q143 173 136 179 Z"/>
    </g>
    <!-- Feathers on the near wing, and locks in the mane. -->
    <g fill="none" stroke="#45346a" stroke-width="3" stroke-linecap="round">
      <path d="M300 120 Q330 128 352 116 Q376 130 404 122 Q428 134 446 118"/>
      <path d="M282 160 Q306 168 326 158 Q350 170 374 162 Q396 174 418 166"/>
      <path d="M268 200 Q290 208 306 200 Q328 210 350 202 Q370 212 388 206"/>
      <path transform="translate(212 244) scale(0.7) translate(-212 -244)" d="M204 170 Q222 178 230 194 M210 188 Q224 200 226 218 M202 208 Q216 222 216 240 M188 228 Q200 240 206 254"/>
    </g>
    <!-- Strands running from his hair back into the mane, his eye, and the sun along his profile. -->
    <g transform="translate(212 244) scale(0.7) translate(-212 -244)">
      <g fill="none" stroke="#45346a" stroke-width="3" stroke-linecap="round">
        <path d="M146 166 Q168 152 198 158 Q214 162 222 174"/>
        <path d="M156 170 Q178 160 200 168 Q210 174 212 188"/>
      </g>
      <ellipse cx="145" cy="190" rx="4.4" ry="3.2" fill="#ffcc4d"/>
      <path d="M137 186 Q138 190 136 193 L129 203 Q127 206 130 207 Q133 208 134 209 Q132 212 133 214 Q135 215 134 216
        Q132 218 134 220 Q137 222 137 224 Q135 229 140 231" fill="none" stroke="#c9705a" stroke-width="2.5"
        stroke-linejoin="round" stroke-linecap="round" opacity="0.8"/>
    </g>
  </g>
</svg>
