# Plateau (CONCEPT.md, POC_PLAN.md): the SDK areas are written against, the engine, the areas, and the spike of step 0.
[workspace]
members = ["sdk", "engine", "areas/played", "spike/host", "spike/view-bevy", "spike/view-wgpu"]
resolver = "3"

[workspace.package]
edition = "2024"
publish = false

# The viewers are slow unoptimized (Bevy above all), and so is sampling an area natively.
[profile.dev]
opt-level = 1
[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
