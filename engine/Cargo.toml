# Plateau's engine (POC_PLAN.md): an area's module checked on load and run in wasmtime with the
# limits the engine keeps, its answers read out of the canonical ABI; its surface in chunks, a body
# walking it, where each size can go, pictures, and the laws.
[package]
name = "plateau-engine"
version = "0.0.0"
edition.workspace = true
publish.workspace = true

[dependencies]
# Without its "threads" feature wasmtime refuses modules that use threads, as the engine must.
wasmtime = { version = "51.0.0", default-features = false, features = ["cranelift", "runtime", "std"] }
# The check on load: wasmtime's own parser, with the features named.
wasmparser = { version = "0.263.0", default-features = false, features = ["std", "validate", "features"] }
# Reading sketched maps (step 6) and writing pictures.
png = "0.18.1"
# A save names each module it was made of by its bytes' hash (WORLD_PLAN.md, phase D).
sha2 = "0.10.9"
# The action log (WORLD_PLAN.md, phase E): one JSON line an action; f32s written shortest and read
# back to the same bits.
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# Spans round the stages an action passes through, for traces (phase E) and the inspector (K).
tracing = "0.1.44"

[dev-dependencies]
# The areas of `areas/` played natively: what their modules must answer as.
areas-played = { path = "../areas/played" }
plateau-sdk = { path = "../sdk" }
# Modules written by hand for the tests: areas made wrong on purpose.
wat = "1.263.0"
# Only for the test that every area can still be made a component of the world.
wit-component = "0.263.0"
